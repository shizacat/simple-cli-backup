[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sback"
version = "1.3.0"
description = "Простая настройка бэкапов на серверах"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexey Matveev" }]
dependencies = [
    "dropbox",
    "mysql-connector-python",
    "pyyaml",
    "requests",
]

[tool.hatch.build.targets.wheel]
packages = ["sback"]
