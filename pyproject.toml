[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sback"
dynamic = ["version"]
description = "Простая настройка бэкапов на серверах"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Alexey Matveev" }]
dependencies = [
    "dropbox>=12.2.4",
    "mysql-connector-python>=26.10.0",
    "pydantic>=2",
    "pymongo>=4.19.0",
    "pyyaml",
    "requests>=2.34.2",
]

[project.scripts]
sback = "sback.main:main"

[dependency-groups]
dev = [
    "black",
    "pytest",
    "pytest-cov>=7.1.0",
]

# Версия пакета берется из sback/__init__.py.
# При публикации workflow подставляет ее из тега через sed.
[tool.hatch.version]
path = "sback/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sback"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=sback --cov-report=term-missing"

[tool.coverage.run]
source = ["sback"]
branch = true

[tool.coverage.report]
show_missing = true
