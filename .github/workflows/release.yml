name: Публикация

on:
  push:
    tags:
      - "v*"
      - "[0-9]*"

permissions:
  contents: read

jobs:
  build:
    name: Сборка
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: "3.12"
          enable-cache: false

      - name: Подставить версию из тега
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Тег ${tag} не является версией X.Y.Z"
            exit 1
          fi
          sed -i "s/^__version__ = \"0.0.0\"$/__version__ = \"${version}\"/" sback/__init__.py
          grep -qx "__version__ = \"${version}\"" sback/__init__.py
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: uv sync

      - name: Black
        run: uv run black --check .

      - name: Pytest
        run: uv run pytest

      - name: Build
        run: uv build

      - name: Check package version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          wheel=(dist/*.whl)
          uv run --isolated --no-project --with "${wheel[0]}" \
            python -c "import os, sback; assert sback.__version__ == os.environ['VERSION'], sback.__version__"

      - name: Upload distributions
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    name: PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/sback
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Publish
        run: uv publish
